# ROS 2 to/from Gazebo topic bridge configuration
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/rexrov2/cmd_vel"
  gz_topic_name: "/rexrov2/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/rexrov2/pose_gt"
  gz_topic_name: "/rexrov2/pose_gt"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/rexrov2/imu"
  gz_topic_name: "/rexrov2/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/rexrov2/blueview_p900_point_cloud"
  gz_topic_name: "/world/oceans_waves/model/rexrov2/link/rexrov2/sonar_link/sensor/blueview_p900_sensor/scan/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
