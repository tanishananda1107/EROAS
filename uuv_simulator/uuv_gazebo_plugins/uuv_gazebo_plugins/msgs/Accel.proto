#ifndef UUV_GZ_SIM_MSGS_ACCEL_HH_
#define UUV_GZ_SIM_MSGS_ACCEL_HH_

#include <gz/msgs/vector3d.pb.h>
#include <gz/msgs/time.pb.h>

namespace uuv_gz_sim::msgs
{

/// Replacement for old Accel.proto in Gazebo Classic
/// Used internally in gz-sim systems/plugins
struct Accel
{
  gz::msgs::Vector3d linear;   // linear acceleration
  gz::msgs::Vector3d angular;  // angular acceleration
  gz::msgs::Time time;         // timestamp
};

} // namespace uuv_gz_sim::msgs

#endif
